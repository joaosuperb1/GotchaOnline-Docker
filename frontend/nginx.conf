server {
    listen 80;
    server_name localhost;

    # Define o limite de upload para 20MB
    client_max_body_size 20M;

    # Servir os arquivos estáticos compilados do Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o backend Flask
    location /api/ {
        # O host "backend" é resolvido pelo DNS interno do Docker Compose.
        # Com resolver + variável, o nginx reresolve o nome periodicamente, então
        # recriar só o container do backend (atualização automática) não gera 502
        # por IP antigo em cache.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:7860;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configura timeouts longos para processamento de IA/ML
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Desativa buffering para suportar streaming de eventos (NDJSON) em tempo real
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
